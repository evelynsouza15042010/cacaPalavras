
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palavra Secreta</title>
<style>:root {
  font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color: #65516d;
  background: #fff5fa;

  --pink: #f4a9c8;
  --pink-dark: #d96f9e;
  --lilac: #d9c5f5;
  --purple: #9876c9;
  --mint: #c9eadb;
  --cream: #fffaf0;
  --ink: #65516d;
  --border: #f0d8e8;
  --panel: #fffdfd;
  --shadow: 0 8px 0 #efd8e8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 8% 12%, #ffe0ed 0, transparent 28%),
    radial-gradient(ellipse at 92% 85%, #e8ddff 0, transparent 30%),
    #fff5fa;
  background-attachment: fixed;
}

main {
  max-width: 760px;
  margin: 30px auto;
  position: relative;
}

/* Cabeçalho fofo */

header {
  text-align: center;
  margin-bottom: 32px;
  padding: 30px 18px;
  background: rgb(255 253 253 / 85%);
  border: 2px solid white;
  border-radius: 32px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

header::before {
  content: "✦";
  position: absolute;
  top: 12px;
  left: 20px;
  color: #e7b6d4;
  font-size: 28px;
  transform: rotate(-15deg);
}

header::after {
  content: "♡";
  position: absolute;
  bottom: 8px;
  right: 20px;
  color: #c4acec;
  font-size: 32px;
  transform: rotate(12deg);
}

header>p:first-child {
  color: var(--pink-dark);
  font-size: 0.8rem;
  font-weight: 900;
  letter-spacing: 3px;
}

h1 {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  line-height: 1.15;
  letter-spacing: -2px;
  color: #b875a0;
  margin: 18px 0 12px;
  text-shadow: 2px 3px 0 #fce2ef;
}

header p {
  line-height: 1.7;
}

/* Cartões */

.panel {
  position: relative;
  background: var(--panel);
  padding: 26px;
  margin-bottom: 20px;
  border: 2px solid white;
  border-radius: 26px;
  box-shadow: var(--shadow);
}

.panel h2 {
  color: #a47ac2;
  font-size: 1.4rem;
  margin-top: 0;
}

#game>button:first-child {
  margin-bottom: 18px;
}

/* Menu de modos */

.modes {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

.modes button {
  text-align: left;
  line-height: 1.5;
  padding: 17px 18px;
  background: #fff5fa;
  border: 2px solid #f4d7e7;
  border-radius: 19px;
  box-shadow: 0 4px 0 #f1d7e7;
  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    background 0.18s ease;
}

.modes button:nth-child(2) {
  background: #f8f2ff;
  border-color: #e3d5f7;
  box-shadow: 0 4px 0 #e3d5f7;
}

.modes button:nth-child(3) {
  background: #effaf4;
  border-color: #d0eadb;
  box-shadow: 0 4px 0 #d0eadb;
}

.modes button:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 0 #edc9dd;
}

/* Botões */

button,
input,
select {
  font: inherit;
}

button {
  min-height: 46px;
  padding: 12px 17px;
  border: 2px solid #efd9e8;
  border-radius: 15px;
  background: white;
  color: var(--ink);
  font-weight: 750;
  cursor: pointer;
  transition:
    transform 0.15s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}

button:hover {
  background: #fff3f9;
  transform: translateY(-2px);
}

button:active {
  transform: translateY(1px);
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #b18ade;
  outline-offset: 4px;
}

button.primary {
  background: linear-gradient(135deg, #f1b3d0, #d8b9f4);
  color: #634568;
  border: 2px solid #e7c0e4;
  box-shadow: 0 4px 0 #e4c4df;
}

button.primary:hover {
  background: linear-gradient(135deg, #f6c2d9, #e3ccfa);
  box-shadow: 0 6px 0 #e4c4df;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

/* Campo de resposta */

input {
  width: 100%;
  min-height: 49px;
  padding: 13px 16px;
  margin: 9px 0 14px;
  color: var(--ink);
  background: #fff9fc;
  border: 2px solid #efd8e9;
  border-radius: 15px;
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

input::placeholder {
  color: #bba9bc;
}

input:focus {
  border-color: #c5a5e8;
  box-shadow: 0 0 0 4px #eee3fb;
}

/* Pistas e mensagens */

#clue {
  background: linear-gradient(135deg, #fff0f7, #f7f0ff);
  border: 2px dashed #e5c5e8;
  border-radius: 20px;
  padding: 20px;
  line-height: 1.7;
  color: #795f85;
}

#instructions {
  line-height: 1.7;
  color: #927d98;
}

.status {
  min-height: 28px;
  padding: 12px 14px;
  border-radius: 14px;
  background: #fff5fa;
  color: #a46692;
  font-weight: 750;
  line-height: 1.6;
}

.small {
  font-size: 0.9rem;
  color: #a391aa;
  line-height: 1.6;
}

/* Tabuleiro do Termo */

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin: 22px 0;
}

.tile {
  min-height: 55px;
  display: grid;
  place-items: center;
  border: 2px solid #eadce9;
  border-radius: 13px;
  background: #fff8fc;
  color: #80698a;
  font-size: 1.2rem;
  font-weight: 900;
  text-transform: uppercase;
}

.tile.correct {
  background: #b8dfca;
  border-color: #9acbb0;
  color: #365f4b;
}

.tile.present {
  background: #f8dda0;
  border-color: #ebcb7c;
  color: #806329;
}

.tile.absent {
  background: #e4dce8;
  border-color: #d4c8d9;
  color: #76697b;
}

/* Histórico */

.history {
  padding-left: 24px;
  line-height: 1.9;
}

.history li {
  padding: 4px 0;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.actions button {
  flex: 1 1 auto;
}

/* Responsividade */

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  main {
    margin: 12px auto;
  }

  header {
    padding: 26px 15px;
    border-radius: 24px;
  }

  h1 {
    letter-spacing: -1px;
  }

  .panel {
    padding: 19px;
    border-radius: 22px;
  }

  .tile {
    min-height: 45px;
    font-size: 1rem;
  }

  .actions button {
    flex: 1 1 100%;
  }
}

/* Respeito à preferência por movimento reduzido */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}</style>
</head>
<body>
<main>
<header>
  <p>✦ DESAFIOS DE PALAVRAS ✦</p>
  <h1>Palavra Secreta</h1>
  <p>Escolha um jogo e descubra até onde suas palavras podem levar você.</p>
</header>

<section id="menu" class="panel">
  <h2>Escolha seu desafio</h2>
  <div class="modes">
    <button class="primary" onclick="start('termo')">
      Termo — descubra a palavra letra por letra
    </button>
    <button onclick="start('charada')">
      Charadas — resolva enigmas
    </button>
    <button onclick="start('misterio')">
      Palavra Misteriosa — descubra usando pistas
    </button>
  </div>
  <p class="small">Protótipo local. Não exige cadastro nem envia dados.</p>
</section>

<section id="game" class="panel hidden">
  <button onclick="showMenu()">← Voltar ao menu</button>
  <h2 id="gameTitle"></h2>
  <p id="instructions"></p>
  <div id="clue" class="panel"></div>
  <div id="board" class="grid hidden" aria-label="Resultado das letras"></div>

  <form id="guessForm">
    <label for="guess"><strong>Seu palpite</strong></label>
    <input id="guess" autocomplete="off" maxlength="30"
      placeholder="Digite sua resposta" required>
    <button class="primary" type="submit">Enviar palpite</button>
  </form>

  <p id="status" class="status" role="status" aria-live="polite"></p>
  <p id="attempts" class="small"></p>
  <ol id="history" class="history"></ol>

  <div class="actions">
    <button id="hintButton" onclick="hint()">Pedir pista</button>
    <button onclick="reveal()">Revelar resposta</button>
    <button onclick="restart()">Novo desafio</button>
  </div>
</section>
</main>

<script>
const puzzles = {
  termo: [
    { answer: "PLANO", hint: "Pode ser uma ideia ou um projeto." },
    { answer: "LIVRO", hint: "Você pode encontrar histórias nele." },
    { answer: "NUVEM", hint: "Pode ser vista no céu." }
  ],
  charada: [
    {
      question: "O que tem dentes, mas não pode morder?",
      answer: "pente",
      hints: ["É usado para arrumar o cabelo."]
    },
    {
      question: "O que sobe, mas nunca desce?",
      answer: "idade",
      hints: ["Todos nós temos uma."]
    },
    {
      question: "Quanto mais se tira, maior fica. O que é?",
      answer: "buraco",
      hints: ["Pode aparecer no chão."]
    }
  ],
  misterio: [
    {
      answer: "arco-íris",
      hints: [
        "Pode aparecer depois da chuva.",
        "Tem várias cores.",
        "Seu nome inclui uma forma curva e uma cor."
      ]
    },
    {
      answer: "abacaxi",
      hints: [
        "É uma fruta.",
        "Tem uma casca áspera.",
        "Seu nome começa com A."
      ]
    },
    {
      answer: "biblioteca",
      hints: [
        "É um lugar público ou privado.",
        "Há muitas histórias guardadas lá.",
        "É um lugar onde se encontram livros."
      ]
    }
  ]
};

let mode = "";
let puzzle;
let puzzleIndex = { termo: 0, charada: 0, misterio: 0 };
let guesses = [];
let hintIndex = 0;
let ended = false;
const $ = id => document.getElementById(id);

function normalize(s) {
  return s.trim().toLocaleLowerCase("pt-BR")
    .normalize("NFC");
}

function start(selectedMode) {
  mode = selectedMode;
  loadPuzzle();
  $("menu").classList.add("hidden");
  $("game").classList.remove("hidden");
}

function loadPuzzle() {
  const list = puzzles[mode];
  puzzle = list[puzzleIndex[mode] % list.length];
  guesses = [];
  hintIndex = 0;
  ended = false;

  $("guess").value = "";
  $("guess").disabled = false;
  $("guessForm").querySelector("button").disabled = false;
  $("history").replaceChildren();
  $("status").textContent = "";
  $("board").replaceChildren();
  $("board").classList.toggle("hidden", mode !== "termo");
  $("hintButton").disabled = false;

  if (mode === "termo") {
    $("gameTitle").textContent = "Termo";
    $("instructions").textContent =
      "Descubra a palavra de cinco letras em até seis tentativas.";
    $("clue").textContent = puzzle.hint;
    $("guess").maxLength = 5;
    $("guess").placeholder = "Palavra de cinco letras";
    $("attempts").textContent = "Tentativas: 0 de 6";
  } else if (mode === "charada") {
    $("gameTitle").textContent = "Charadas";
    $("instructions").textContent =
      "Leia o enigma e tente descobrir a resposta.";
    $("clue").textContent = puzzle.question;
    $("guess").maxLength = 30;
    $("guess").placeholder = "Sua resposta";
    $("attempts").textContent = "";
  } else {
    $("gameTitle").textContent = "Palavra Misteriosa";
    $("instructions").textContent =
      "Use as pistas para descobrir a palavra secreta.";
    $("clue").textContent = puzzle.hints[0];
    $("guess").maxLength = 30;
    $("guess").placeholder = "Sua resposta";
    $("attempts").textContent = "Pistas reveladas: 1";
    hintIndex = 1;
  }
  $("guess").focus();
}

function startNextPuzzle() {
  puzzleIndex[mode]++;
  loadPuzzle();
}

function renderHistory(value, feedback) {
  const li = document.createElement("li");
  li.textContent = value + (feedback ? " — " + feedback : "");
  $("history").appendChild(li);
}

function submitGuess(event) {
  event.preventDefault();
  if (ended) return;

  const value = $("guess").value.trim();
  if (!value) {
    $("status").textContent = "Digite uma resposta primeiro.";
    return;
  }

  if (mode === "termo" && !/^[a-záàâãéêíóôõúç]{5}$/i.test(value)) {
    $("status").textContent =
      "Digite uma palavra válida com cinco letras.";
    return;
  }

  if (guesses.some(g => normalize(g) === normalize(value))) {
    $("status").textContent = "Você já tentou essa palavra.";
    return;
  }

  guesses.push(value);
  $("guess").value = "";

  if (mode === "termo") {
    const result = evaluateWord(value.toLocaleUpperCase("pt-BR"),
      puzzle.answer);
    renderHistory(value.toLocaleUpperCase("pt-BR"),
      result.map(x => ({
        correct: "letra correta",
        present: "letra em outra posição",
        absent: "letra ausente"
      }[x])).join(", "));
    drawTiles(value.toLocaleUpperCase("pt-BR"), result);
    $("attempts").textContent = `Tentativas: ${guesses.length} de 6`;

    if (normalize(value) === normalize(puzzle.answer)) {
      finish("Você acertou! Parabéns!");
    } else if (guesses.length >= 6) {
      finish("Fim das tentativas. A resposta era " + puzzle.answer + ".");
    } else {
      $("status").textContent = "Veja o resultado das letras e tente novamente.";
    }
  } else if (normalize(value) === normalize(puzzle.answer)) {
    renderHistory(value, "Correto!");
    finish("Você acertou! Muito bem!");
  } else {
    renderHistory(value, "Ainda não é a resposta.");
    $("status").textContent = "Tente novamente ou peça outra pista.";
  }
}

function evaluateWord(guess, answer) {
  const result = Array(guess.length).fill("absent");
  const remaining = {};

  for (let i = 0; i < answer.length; i++) {
    if (guess[i] === answer[i]) {
      result[i] = "correct";
    } else {
      remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
    }
  }

  for (let i = 0; i < guess.length; i++) {
    if (result[i] === "correct") continue;
    if (remaining[guess[i]] > 0) {
      result[i] = "present";
      remaining[guess[i]]--;
    }
  }
  return result;
}

function drawTiles(word, result) {
  const board = $("board");
  board.replaceChildren();
  [...word].forEach((letter, i) => {
    const tile = document.createElement("div");
    tile.className = "tile " + result[i];
    tile.textContent = letter;
    tile.setAttribute("aria-label", letter + ": " + ({
      correct: "posição correta",
      present: "está na palavra em outra posição",
      absent: "não está na palavra"
    }[result[i]]));
    board.appendChild(tile);
  });
}

function hint() {
  if (ended) return;
  const list = mode === "misterio" ? puzzle.hints :
    (puzzle.hints || []);
  if (hintIndex >= list.length) {
    $("status").textContent = "Não há mais pistas disponíveis.";
    return;
  }
  $("clue").textContent = list[hintIndex];
  hintIndex++;
  $("attempts").textContent = "Pistas reveladas: " + hintIndex;
}

function finish(message) {
  ended = true;
  $("status").textContent = message;
  $("guess").disabled = true;
  $("guessForm").querySelector("button").disabled = true;
  $("hintButton").disabled = true;
}

function reveal() {
  if (ended) return;
  finish("A resposta era: " + puzzle.answer + ".");
}

function restart() {
  startNextPuzzle();
}

function showMenu() {
  $("game").classList.add("hidden");
  $("menu").classList.remove("hidden");
}

$("guessForm").addEventListener("submit", submitGuess);
</script>
</body>
</html>
